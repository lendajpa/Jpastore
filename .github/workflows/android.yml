name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Gerar release assinada
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Testar, analisar e compilar APK de testes
        run: gradle :android-launcher:testDebugUnitTest :android-launcher:lintDebug :android-launcher:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: JPA-BOX-TESTE
          path: android-launcher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Preparar assinatura de release
        if: inputs.release == true
        env:
          KEYSTORE: ${{ secrets.JPA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure os secrets de assinatura'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/jpa.jks"
      - name: Compilar release assinada
        if: inputs.release == true
        env:
          JPA_KEYSTORE_PATH: ${{ runner.temp }}/jpa.jks
          JPA_STORE_PASSWORD: ${{ secrets.JPA_STORE_PASSWORD }}
          JPA_KEY_ALIAS: ${{ secrets.JPA_KEY_ALIAS }}
          JPA_KEY_PASSWORD: ${{ secrets.JPA_KEY_PASSWORD }}
        run: gradle :android-launcher:assembleRelease
      - uses: actions/upload-artifact@v4
        if: inputs.release == true
        with:
          name: JPA-BOX-RELEASE
          path: android-launcher/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Remover chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/jpa.jks"
